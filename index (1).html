<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banana Notepad</title>
<meta name="theme-color" content="#0e0f14">
<meta name="description" content="Banana Notepad - a simple dark notes app">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#0e0f14;--panel:#181a21;--card:#1e2029;--accent:#FFD84D;--text:#f0f2f7;--muted:#9499a8;--green:#59c792;--red:#f55a66}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  .screen.active{display:flex}
  .row{display:flex;align-items:center;gap:8px}
  .brand{flex:1;color:var(--accent);font-weight:800;letter-spacing:1px;font-size:17px}
  button{font:inherit;border:0;color:var(--text);cursor:pointer}
  .btn{background:var(--panel);border-radius:14px;height:46px;padding:0 16px;font-weight:700;font-size:14px}
  .btn.accent{background:var(--accent);color:#1a1500}
  .btn:active{filter:brightness(.85)}
  h1{font-size:27px;margin:14px 0 10px}
  .search{width:100%;height:48px;border:0;border-radius:14px;background:var(--panel);color:var(--text);padding:0 14px;font-size:14px;outline:none}
  #list{flex:1;overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:11px;padding-bottom:6px}
  .card{background:var(--card);border-radius:18px;padding:14px 16px;position:relative;min-height:96px}
  .card .t{font-weight:700;font-size:16px;padding-right:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .b{color:var(--muted);font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .card .d{color:#6e7381;font-size:11px;margin-top:8px}
  .card .pin{position:absolute;right:50px;top:12px;color:var(--accent);font-weight:800}
  .card .more{position:absolute;right:8px;top:6px;background:none;font-size:22px;color:var(--muted);width:38px;height:38px}
  .empty{color:var(--muted);text-align:center;margin-top:50px;line-height:1.7;font-size:14px}
  nav{display:flex;background:var(--panel);border-radius:18px;padding:5px;gap:5px}
  nav button{flex:1;background:none;color:var(--muted);height:52px;border-radius:14px;font-size:12px;font-weight:700}
  nav button.on{color:var(--accent)}
  .save{font-size:11px;color:var(--green)}
  .title{width:100%;border:0;background:none;color:var(--text);font-size:25px;font-weight:700;padding:14px 3px;outline:none}
  .body{flex:1;width:100%;border:0;background:none;color:var(--text);font-size:16px;line-height:1.5;padding:8px 4px;outline:none;resize:none}
  ::placeholder{color:var(--muted)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
  .sheet .name{font-weight:700;font-size:17px;margin:2px 0 6px}
  .sheet .btn{background:var(--card);text-align:left}
  .sheet .btn.danger{color:var(--red)}
</style>
</head>
<body>
<section id="home" class="screen active">
  <div class="row"><div class="brand">BANANA NOTEPAD</div><button class="btn accent" id="add" style="width:52px;padding:0;font-size:24px">+</button></div>
  <h1 id="heading">My Notes</h1>
  <input id="search" class="search" type="search" placeholder="Search your notes" autocomplete="off">
  <div id="list"></div>
  <nav id="nav">
    <button data-v="Notes">Notes</button><button data-v="Pinned">Pinned</button>
    <button data-v="Archive">Archive</button><button data-v="Trash">Trash</button>
  </nav>
</section>

<section id="editor" class="screen">
  <div class="row">
    <button class="btn" id="back" style="width:48px;padding:0;font-size:22px">&lsaquo;</button>
    <div style="flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:11px">EDIT NOTE</div>
    <div class="save" id="saved">Saved</div>
  </div>
  <input id="etitle" class="title" placeholder="Title" autocomplete="off">
  <textarea id="ebody" class="body" placeholder="Start writing..."></textarea>
  <div class="row">
    <button class="btn" id="epin" style="flex:1">Pin</button>
    <button class="btn" id="earch" style="flex:1">Archive</button>
    <button class="btn" id="emore" style="flex:1">More</button>
  </div>
</section>

<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<script src="./app.js"></script>
</body>
</html>
